<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Weather — Meteorology Engine</title>
  <script>
    (function () {
      const auraUser = localStorage.getItem('aura_user');
      const auraGuest = sessionStorage.getItem('aura_guest');
      if (auraUser || auraGuest) {
        window.location.replace('weather-dashboard.html');
      } else {
        window.location.replace('registration.html');
      }
    })();
  </script>
</head>
<body style="margin:0; background:#f6faff; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:'Plus Jakarta Sans',sans-serif; color:#737785;">
  <p>Loading Aura Weather...</p>
</body>
</html>
