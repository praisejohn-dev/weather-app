services:
  - type: web
    name: aura-weather-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/server.py
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
